name: Lena Lab CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: lena-lab-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Syntax and tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run tests (intentional first-run failure)
        env:
          LENA_LAB_CI_DEMO: fail
        run: npm test
